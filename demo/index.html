<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>סידור | דמו אינטראקטיבי</title>
<meta name="description" content="Sidur – interactive prototype of a Hebrew RTL shift scheduler for multi-branch businesses. Built by Gal Asulin.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Rubik:wght@500;600;700&display=swap">
<style>
:root{--bg:#F4F3EF;--card:#FFF;--ink:#17181C;--muted:#5E6068;--line:#E3E1DA;--sec:#2B5BA8;--sec-t:#E7EEF9;--sec-i:#1B3F7A;--ther:#B4531A;--ther-t:#FBEADF;--ther-i:#7A3410;--bad:#9B1C1C;--bad-t:#FFF5F4;--ok:#1E5B35;--ok-t:#E3F1E8;--warn:#7A4B00;--warn-t:#FFF4D6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Assistant',system-ui,sans-serif}
h1,h2,h3,.rb{font-family:'Rubik',system-ui,sans-serif}
button{font:inherit;cursor:pointer}
.demo-note{background:var(--ink);color:#D6D7DB;font-size:13.5px;padding:8px 16px;text-align:center}
.demo-note a{color:#FFF}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--ink);display:flex;align-items:center;justify-content:center}
.brand b{font-family:'Rubik';font-size:18px;display:block}.brand small{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--bg);padding:4px;border-radius:999px}
.tab{border:0;background:transparent;font-size:14.5px;font-weight:600;min-height:40px;padding:0 16px;border-radius:999px;color:#4A4C54}
.tab[aria-current="page"]{background:var(--ink);color:#FFF}
.btn{font-size:14px;font-weight:600;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid #D9D6CE;background:#FFF;color:var(--ink);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn.pri{background:var(--ink);color:#FFF;border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ibtn{width:40px;height:40px;border-radius:10px;border:1px solid #D9D6CE;background:#FFF;display:inline-flex;align-items:center;justify-content:center}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px 6px}
.toolbar .g{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:700}
.pill.draft{background:var(--warn-t);color:var(--warn)}.pill.lock{background:var(--ok-t);color:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;padding:8px 20px 2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.kpi{padding:10px 14px}.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600}.kpi .v{font-family:'Rubik';font-size:24px;font-weight:700}
.kpi.bad{background:var(--bad-t);border-color:#F3C9C4}.kpi.bad .l,.kpi.bad .v{color:var(--bad)}
.body{display:flex;flex-wrap:wrap;gap:12px;padding:10px 20px 24px;align-items:flex-start}
aside{flex:1 1 260px;max-width:300px;padding:13px;display:flex;flex-direction:column;gap:9px}
main{flex:999 1 640px;min-width:0;padding:10px}
.scroll{overflow-x:auto}
.inner{min-width:1000px;display:flex;flex-direction:column;gap:6px}
.wrow{display:grid;grid-template-columns:118px repeat(6,minmax(0,1fr));gap:6px}
.rl{display:flex;flex-direction:column;justify-content:center;padding:0 2px}.rl b{font-size:14px}.rl span{font-size:12px;color:var(--muted)}
.dayh{padding:8px 10px;border-radius:10px;background:#F7F6F2}.dayh b{font-family:'Rubik';font-size:15px;display:block}.dayh span{font-size:12px;color:var(--muted)}
.sechead{display:flex;align-items:center;gap:8px;padding:8px 2px 1px;border-top:1px solid #EEECE6;margin-top:4px}.sechead i{width:9px;height:9px;border-radius:50%}.sechead b{font-family:'Rubik';font-size:15px}.sechead span{font-size:12.5px;color:var(--muted)}
.cell{background:#FFF;border:1px solid var(--line);border-radius:10px;padding:7px;display:flex;flex-direction:column;gap:5px;min-height:84px}
.closed{background:repeating-linear-gradient(135deg,#F1EFE9 0 8px,#ECEAE3 8px 16px);border:1px solid var(--line);border-radius:10px;min-height:84px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;font-weight:600}
.chip{display:flex;align-items:center;gap:7px;padding:4px 6px 4px 9px;border-radius:8px;font-size:13px;font-weight:600;white-space:nowrap}
.chip .ini{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.chip .x{margin-inline-start:auto;border:0;background:transparent;width:24px;height:24px;border-radius:6px;color:inherit;opacity:.55}
.chip .x:hover{opacity:1;background:rgba(0,0,0,.06)}
.sec{background:var(--sec-t);color:var(--sec-i)}.sec .ini{background:var(--sec);color:#FFF}
.ther{background:var(--ther-t);color:var(--ther-i)}.ther .ini{background:var(--ther);color:#FFF}
.off{background:#ECEBE6;color:#3E4047}.off .ini{background:#6B6D75;color:#FFF}
.gap{width:100%;min-height:34px;border-radius:8px;border:1.5px dashed #B42318;background:var(--bad-t);color:var(--bad);font-size:12.5px;font-weight:700}
.add{width:100%;min-height:28px;border-radius:8px;border:1px dashed #CFCCC3;background:transparent;color:var(--muted);font-size:14px;font-weight:600}
.locked .gap,.locked .add,.locked .x{display:none}
.emp{display:flex;flex-direction:column;gap:5px;padding:7px 8px;border-radius:10px;border:1px solid #EEECE6}
.emp .r{display:flex;justify-content:space-between;align-items:center}
.bar{height:5px;border-radius:3px;background:#ECEAE3;overflow:hidden}.bar i{display:block;height:5px}
.foot{text-align:center;font-size:12.5px;color:#6B6D75;padding:4px 0 24px}.foot a{color:#4A4C54}
dialog{border:0;border-radius:14px;padding:0;width:min(560px,94vw);box-shadow:0 20px 50px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(23,24,28,.4)}
.dlg{padding:20px 22px;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#FFF;text-align:right}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{opacity:.55;cursor:not-allowed}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700}
.t-ok{background:var(--ok-t);color:var(--ok)}.t-warn{background:var(--warn-t);color:var(--warn)}.t-bad{background:var(--bad-t);color:var(--bad)}.t-dis{background:#ECEBE6;color:#3E4047}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#FFF;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="demo-note">דמו אינטראקטיבי עם נתוני דוגמה בלבד. השינויים נשמרים רק בדפדפן שלך. | <a href="https://github.com/galasulin/shift-scheduler-showcase">חזרה לריפו</a></div>

<header class="topbar">
  <div class="brand"><div class="logo"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M8 14h3M8 17h6"/></svg></div><div><b>סידור עבודה</b><small>ניהול משמרות לעסקים</small></div></div>
  <nav class="tabs" aria-label="סניפים" id="tabs"></nav>
  <button class="btn" id="reset">איפוס נתוני הדמו</button>
</header>

<section class="toolbar">
  <div class="g">
    <button class="ibtn" id="prev" aria-label="שבוע קודם"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    <div><h1 style="margin:0;font-size:22px" id="wtitle"></h1><span style="font-size:13px;color:var(--muted)" id="wsub"></span></div>
    <button class="ibtn" id="next" aria-label="שבוע הבא"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <span id="status"></span>
  </div>
  <div class="g">
    <button class="btn" id="copy">העתקת שבוע קודם</button>
    <button class="btn" id="print">הדפסה</button>
    <button class="btn pri" id="lock"></button>
  </div>
</section>

<section class="kpis" id="kpis" aria-label="סיכום שבוע"></section>

<div class="body">
  <aside class="card" aria-label="עובדי הסניף" id="side"></aside>
  <main class="card"><div class="scroll"><div class="inner" id="grid"></div></div></main>
</div>
<div class="foot">נבנה על ידי <b>גל אסולין</b> | IT Manager | The King | <a href="https://github.com/galasulin">github.com/galasulin</a></div>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  var BR = [
    { id: 'merkaz', name: 'מרכז', sec: [['נועה', 30], ['מיכל', 26], ['שירן', 26], ['ליאת', 24]], ther: [['דניאל', 30], ['אורית', 26], ['יוסי', 28], ['תמר', 24], ['רועי', 24]] },
    { id: 'tzafon', name: 'צפון', sec: [['עדי', 30], ['הילה', 26], ['רוני', 26], ['ענבל', 24]], ther: [['אלון', 30], ['מאיה', 26], ['עומר', 28], ['שני', 24], ['אריאל', 24]] },
    { id: 'sharon', name: 'שרון', sec: [['יעל', 30], ['דנה', 26], ['אורטל', 26], ['מירב', 24]], ther: [['איתי', 30], ['ליה', 26], ['גיא', 28], ['נגה', 24], ['עמית', 24]] },
    { id: 'shfela', name: 'שפלה', sec: [['רותם', 30], ['ספיר', 26], ['טל', 26], ['אושרית', 24]], ther: [['עידו', 30], ['קרן', 26], ['אסף', 28], ['מור', 24], ['יובל', 24]] },
    { id: 'darom', name: 'דרום', sec: [['אביטל', 30], ['שחר', 26], ['הדר', 26], ['סיון', 24]], ther: [['ניר', 30], ['אנה', 26], ['בן', 28], ['גלית', 24], ['אייל', 24]] }
  ];
  var SH = {
    sec: [{ k: 'm', l: 'בוקר', t: ['07:30', '14:00'], need: 2, fri: { t: ['08:00', '13:00'], need: 1 } }, { k: 'e', l: 'ערב', t: ['13:30', '20:00'], need: 1, fri: null }],
    ther: [{ k: 'm', l: 'בוקר', t: ['08:00', '14:00'], need: 2, fri: { t: ['08:00', '13:00'], need: 1 } }, { k: 'e', l: 'ערב', t: ['14:00', '20:00'], need: 2, fri: null }]
  };
  var ROLE = { sec: { title: 'צוות שירות', sub: 'קבלת לקוחות, טלפונים ותיאום', color: '#2B5BA8' }, ther: { title: 'צוות מקצועי', sub: 'אנשי המקצוע בסניף', color: '#B4531A' } };
  var DAYS = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי'];
  var BASE = Date.UTC(2026, 9, 25); // Sunday 25.10.2026
  var KEY = 'sidur-demo-v1';

  var st = load() || seed();
  var cur = { b: 0, w: 0 };

  function mins(t) { var p = t.split(':'); return +p[0] * 60 + +p[1]; }
  function hrs(t) { return (mins(t[1]) - mins(t[0])) / 60; }
  function fmt(x) { return (Math.round(x * 10) / 10).toString(); }
  function wdate(w, d) { var dt = new Date(BASE + (w * 7 + d) * 864e5); return dt.getUTCDate() + '.' + (dt.getUTCMonth() + 1); }
  function slotK(b, w, r, s, d) { return [b, w, r, s, d].join('|'); }
  function shiftOf(r, s, d) { var x = SH[r].filter(function (z) { return z.k === s; })[0]; if (d === 5) return x.fri ? { t: x.fri.t, need: x.fri.need } : null; return { t: x.t, need: x.need }; }
  function rnd(seedN) { var x = Math.sin(seedN) * 10000; return x - Math.floor(x); }

  function seed() {
    var s = { a: {}, abs: {}, lock: {} };
    BR.forEach(function (br, bi) {
      for (var w = -1; w <= 4; w++) {
        ['sec', 'ther'].forEach(function (r, ri) {
          var h = {}, tg = {}; br[r].forEach(function (e) { h[e[0]] = 0; tg[e[0]] = e[1]; });
          for (var d = 0; d < 6; d++) {
            var used = [];
            SH[r].forEach(function (sh, si) {
              var x = shiftOf(r, sh.k, d); if (!x) return;
              var cand = br[r].map(function (e) { return e[0]; }).filter(function (n) { return used.indexOf(n) < 0; });
              cand.sort(function (p, q) { return (h[p] / tg[p] - h[q] / tg[q]) || (rnd(bi + w * 7 + d * 3 + p.length) - rnd(bi + w * 5 + d + q.length)); });
              var n = x.need;
              if (w >= 0 && rnd(bi * 97 + w * 31 + ri * 13 + si * 7 + d * 3 + 1) > 0.9) n = n - 1;
              var pick = cand.slice(0, n);
              pick.forEach(function (p) { h[p] += hrs(x.t); used.push(p); });
              s.a[slotK(br.id, w, r, sh.k, d)] = pick;
            });
          }
        });
      }
    });
    s.abs[slotK('merkaz', 0, '', '', 3)] = [['שירן', 'חופשה']];
    s.abs[slotK('merkaz', 0, '', '', 4)] = [['רועי', 'מחלה']];
    s.abs[slotK('tzafon', 0, '', '', 1)] = [['מאיה', 'מילואים']];
    s.lock['merkaz|-1'] = true; s.lock['tzafon|-1'] = true;
    // remove absentees from their days
    Object.keys(s.abs).forEach(function (k) {
      var p = k.split('|'); s.abs[k].forEach(function (a) {
        ['sec', 'ther'].forEach(function (r) { ['m', 'e'].forEach(function (sk) { var kk = slotK(p[0], p[1], r, sk, p[4]); if (s.a[kk]) s.a[kk] = s.a[kk].filter(function (n) { return n !== a[0]; }); }); });
      });
    });
    return s;
  }
  function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { } }

  function br() { return BR[cur.b]; }
  function locked() { return !!st.lock[br().id + '|' + cur.w]; }
  function absOn(d) { return st.abs[slotK(br().id, cur.w, '', '', d)] || []; }
  function isAbsent(n, d) { return absOn(d).some(function (a) { return a[0] === n; }); }
  function weekHours(n, r) {
    var h = 0;
    SH[r].forEach(function (sh) { for (var d = 0; d < 6; d++) { var x = shiftOf(r, sh.k, d); if (!x) continue; if ((st.a[slotK(br().id, cur.w, r, sh.k, d)] || []).indexOf(n) >= 0) h += hrs(x.t); } });
    return h;
  }

  function el(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function chip(n, r, x) { return '<div class="chip ' + r + '"><span class="ini">' + esc(n.charAt(0)) + '</span>' + esc(n) + (x ? '<button class="x" aria-label="הסרת ' + esc(n) + '" data-rm="' + esc(x) + '" data-n="' + esc(n) + '">✕</button>' : '') + '</div>'; }

  function render() {
    var b = br(), lk = locked();
    el('tabs').innerHTML = BR.map(function (x, i) { return '<button class="tab" data-b="' + i + '"' + (i === cur.b ? ' aria-current="page"' : '') + '>' + x.name + '</button>'; }).join('');
    el('wtitle').textContent = 'שבוע ' + wdate(cur.w, 0) + ' עד ' + wdate(cur.w, 5) + '.2026';
    el('wsub').textContent = 'סניף ' + b.name + (cur.w === 0 ? ' | שבוע הבא' : cur.w < 0 ? ' | שבוע שעבר' : ' | בעוד ' + (cur.w + 1) + ' שבועות');
    el('status').innerHTML = lk ? '<span class="pill lock">נעול</span>' : '<span class="pill draft">טיוטה | עדיין לא נעול</span>';
    el('lock').textContent = lk ? 'פתיחת נעילה' : 'נעילת השבוע';
    el('copy').disabled = lk;

    var tot = 0, slots = 0, fill = 0, gaps = 0, dh = [0, 0, 0, 0, 0, 0];
    var g = '<div class="wrow"><div class="rl"><span style="font-weight:600">משמרת</span></div>';
    var body = '';
    ['sec', 'ther'].forEach(function (r) {
      body += '<div class="sechead"><i style="background:' + ROLE[r].color + '"></i><b>' + ROLE[r].title + '</b><span>' + ROLE[r].sub + '</span></div>';
      SH[r].forEach(function (sh) {
        body += '<div class="wrow"><div class="rl"><b>' + sh.l + '</b><span>' + sh.t[0] + ' עד ' + sh.t[1] + '</span><span>נדרשים ' + sh.need + '</span></div>';
        for (var d = 0; d < 6; d++) {
          var x = shiftOf(r, sh.k, d);
          if (!x) { body += '<div class="closed">סגור</div>'; continue; }
          var k = slotK(b.id, cur.w, r, sh.k, d), names = st.a[k] || [], h = hrs(x.t);
          tot += h * names.length; dh[d] += h * names.length; slots += x.need; fill += Math.min(names.length, x.need);
          var miss = x.need - names.length; if (miss > 0) gaps++;
          body += '<div class="cell' + (lk ? ' locked' : '') + '">' + (d === 5 ? '<span style="font-size:11.5px;font-weight:600;color:var(--muted)">' + x.t[0] + ' עד ' + x.t[1] + '</span>' : '');
          names.forEach(function (n) { body += chip(n, r, k); });
          body += miss > 0 ? '<button class="gap" data-k="' + k + '">' + (miss === 1 ? 'חסר עובד אחד | שיבוץ' : 'חסרים ' + miss + ' | שיבוץ') + '</button>' : '<button class="add" data-k="' + k + '" aria-label="הוספת עובד">+</button>';
          body += '</div>';
        }
        body += '</div>';
      });
    });
    DAYS.forEach(function (d, i) { g += '<div class="dayh"' + (i === 5 ? ' style="background:#F1EFE9"' : '') + '><b>' + d + '</b><span>' + wdate(cur.w, i) + ' | ' + fmt(dh[i]) + ' ש\'</span></div>'; });
    g += '</div>' + body;
    var ac = 0;
    g += '<div class="sechead"><i style="background:#6B6D75"></i><b>היעדרויות</b><span>חופשה, מחלה, מילואים</span></div><div class="wrow"><div class="rl"><b>כל היום</b></div>';
    for (var d = 0; d < 6; d++) { g += '<div style="min-height:44px;border:1px solid #EEECE6;border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:5px">'; absOn(d).forEach(function (a) { ac++; g += '<div class="chip off"><span class="ini">' + esc(a[0].charAt(0)) + '</span>' + esc(a[0]) + ' | ' + esc(a[1]) + '</div>'; }); g += '</div>'; }
    g += '</div>';
    el('grid').innerHTML = g;

    el('kpis').innerHTML = '<div class="card kpi"><div class="l">שעות מתוכננות</div><div class="v">' + fmt(tot) + '</div></div><div class="card kpi"><div class="l">משבצות מאוישות</div><div class="v">' + fill + ' / ' + slots + '</div></div><div class="card kpi' + (gaps ? ' bad' : '') + '"><div class="l">משמרות חסרות</div><div class="v">' + gaps + '</div></div><div class="card kpi"><div class="l">היעדרויות השבוע</div><div class="v">' + ac + '</div></div>';

    var sd = '<b class="rb" style="font-size:16px">עובדי הסניף</b>';
    ['sec', 'ther'].forEach(function (r) {
      sd += '<div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:#4A4C54"><span>' + ROLE[r].title + '</span><span style="font-weight:600;color:var(--muted)">שעות / יעד</span></div>';
      b[r].forEach(function (e) {
        var h = weekHours(e[0], r), ov = h > e[1];
        sd += '<div class="emp"><div class="r"><div class="chip ' + r + '" style="padding:0;background:transparent"><span class="ini">' + esc(e[0].charAt(0)) + '</span><span style="color:var(--ink)">' + esc(e[0]) + '</span></div><span class="rb" style="font-size:13.5px;font-weight:600;color:' + (ov ? 'var(--bad)' : 'var(--ink)') + '">' + fmt(h) + ' / ' + e[1] + '</span></div><div class="bar"><i style="width:' + Math.min(100, Math.round(h / e[1] * 100)) + '%;background:' + (ov ? '#B42318' : ROLE[r].color) + '"></i></div>' + (ov ? '<span style="font-size:11.5px;font-weight:700;color:var(--bad)">חריגה מהיעד השבועי</span>' : '') + '</div>';
      });
    });
    el('side').innerHTML = sd;
  }

  function openAssign(k) {
    var p = k.split('|'), r = p[2], sk = p[3], d = +p[4], x = shiftOf(r, sk, d), b = br();
    var other = sk === 'm' ? 'e' : 'm', otherShift = shiftOf(r, other, d);
    var overlap = otherShift && mins(otherShift.t[0]) < mins(x.t[1]) && mins(x.t[0]) < mins(otherShift.t[1]);
    var inSlot = st.a[k] || [], inOther = st.a[slotK(b.id, cur.w, r, other, d)] || [];
    var shName = SH[r].filter(function (z) { return z.k === sk; })[0].l;
    var h = '<div style="display:flex;justify-content:space-between;align-items:flex-start"><div><h2 style="margin:0;font-size:20px">שיבוץ למשמרת</h2><div style="font-size:14px;color:var(--muted);margin-top:2px">' + b.name + ' | ' + ROLE[r].title + ' | ' + shName + ' ' + x.t[0] + ' עד ' + x.t[1] + ' | ' + DAYS[d] + ' ' + wdate(cur.w, d) + '</div></div><button class="ibtn" data-close aria-label="סגירה">✕</button></div>';
    h += '<div><span class="tag t-ok">משובצים ' + inSlot.length + ' מתוך ' + x.need + '</span></div>';
    b[r].forEach(function (e) {
      var n = e[0], wh = weekHours(n, r), s, lab;
      if (inSlot.indexOf(n) >= 0) { s = 'dis'; lab = 'כבר במשמרת'; }
      else if (isAbsent(n, d)) { s = 'bad'; lab = 'נעדר ביום זה'; }
      else if (overlap && inOther.indexOf(n) >= 0) { s = 'bad'; lab = 'משמרת חופפת'; }
      else if (wh + hrs(x.t) > e[1]) { s = 'warn'; lab = 'יעבור את היעד'; }
      else { s = 'ok'; lab = 'פנוי'; }
      h += '<button class="opt" ' + (s === 'dis' || s === 'bad' ? 'disabled' : 'data-pick="' + esc(n) + '" data-warn="' + (s === 'warn' ? 1 : 0) + '"') + '><span style="display:flex;align-items:center;gap:10px">' + chip(n, r) + '<span style="font-size:13px;color:var(--muted)">' + fmt(wh) + ' / ' + e[1] + ' ש\'</span></span><span class="tag t-' + s + '">' + lab + '</span></button>';
    });
    h += '<div><button class="btn" data-close>ביטול</button></div>';
    el('dlgBody').innerHTML = h; el('dlgBody').dataset.k = k;
    el('dlg').showModal();
  }

  function toast(t) { var e = el('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function () { e.classList.remove('on'); }, 2200); }

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('button'); if (!t) return;
    if (t.dataset.b != null) { cur.b = +t.dataset.b; render(); }
    else if (t.id === 'prev') { if (cur.w > -1) { cur.w--; render(); } else toast('בדמו אפשר לחזור שבוע אחד אחורה'); }
    else if (t.id === 'next') { if (cur.w < 4) { cur.w++; render(); } else toast('בדמו אפשר לתכנן עד 5 שבועות קדימה'); }
    else if (t.id === 'lock') { var k = br().id + '|' + cur.w; if (st.lock[k]) delete st.lock[k]; else st.lock[k] = true; save(); render(); toast(st.lock[k] ? 'השבוע ננעל' : 'הנעילה נפתחה'); }
    else if (t.id === 'copy') {
      if (cur.w <= -1) return toast('אין שבוע קודם בדמו');
      ['sec', 'ther'].forEach(function (r) { SH[r].forEach(function (sh) { for (var d = 0; d < 6; d++) { var src = st.a[slotK(br().id, cur.w - 1, r, sh.k, d)]; if (src) st.a[slotK(br().id, cur.w, r, sh.k, d)] = src.filter(function (n) { return !isAbsent(n, d); }); } }); });
      save(); render(); toast('השבוע הועתק מהשבוע הקודם, בלי עובדים שנעדרים');
    }
    else if (t.id === 'print') window.print();
    else if (t.id === 'reset') { st = seed(); save(); render(); toast('נתוני הדמו אופסו'); }
    else if (t.dataset.k) openAssign(t.dataset.k);
    else if (t.dataset.rm) { var a = st.a[t.dataset.rm] || []; st.a[t.dataset.rm] = a.filter(function (n) { return n !== t.dataset.n; }); save(); render(); }
    else if (t.dataset.close != null) el('dlg').close();
    else if (t.dataset.pick) {
      var k2 = el('dlgBody').dataset.k; (st.a[k2] = st.a[k2] || []).push(t.dataset.pick); save(); el('dlg').close(); render();
      toast(t.dataset.warn === '1' ? t.dataset.pick + ' שובץ/ה, שימו לב: חריגה מהיעד' : t.dataset.pick + ' שובץ/ה');
    }
  });
  render();
})();
</script>
